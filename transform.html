<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .container, .inner{
            width: 200px;
            height: 200px;
        }
        .container{
            border: 2px solid slateblue;
            background-color: aquamarine;
        }
        .inner{
            border: 2px solid thistle;
            background-color: rgb(11, 119, 214);
            /* transform: scale(0.5, 0.75); */
            /* transform: rotate(45deg); */
            /* transform: scale(0.5) rotate(45deg) translateX(30px); */
            /* transform: translateX(100px); */
            /* transform: scale(0.5); */
            
        }
        .inner:hover{
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <h2>Explore transform and translate</h2>
    <div class="container"> 
        <div class="inner">inner-1</div>
    </div>
    <div class="container"> 
        <div class="inner">inner-2</div>
    </div>
    <div class="container"> 
        <div class="inner">inner-3</div>
    </div>
    
</body>
</html>
