<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .box{
          height: 100px;
          width: 100px;
          border: 2px solid blue;
          background-color: aqua;
          /* property name | duration | easing function | delay */
            /* transition: width 5s linear 2s, background-color 3s ease-in 2s; */
            transition: transform 3s ;
            margin-left: 70px;
        }

        .box:hover{
            /* width: 400px;
            background-color: blueviolet; */
            transform: rotate(45deg) scale(1.5) translateX(150px);
            
        }
    </style>
</head>
<body>
    <ul>
        <li>Transform:change the style.This is a css style propaty name</li>
        <li>Translate:It is value of the transform style rule.This means you move either x, or y or both axix</li>
        <li>Transition:How long it will take to do the change of the shape or colour</li>
    </ul>
    <div class="box">Box-1</div>
    <div class="box">Box-2</div>
    <div class="box">Box-3</div>
    
</body>
</html>
